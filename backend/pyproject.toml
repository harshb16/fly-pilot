[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-pilot"
version = "0.3.0"
description = "FlyPilot: JSBSim Cessna 172 landing sandbox plus a standalone MaleCNS-derived LIF simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsbsim>=1.2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "websockets>=12.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fly-pilot = "fly_pilot.server:main"
fly-pilot-eval = "fly_pilot.evaluate:main"
fly-pilot-record = "fly_pilot.record_expert:main"

[tool.setuptools.packages.find]
include = ["fly_pilot*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
