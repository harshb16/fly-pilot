[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-pilot"
version = "0.5.0"
description = "FlyPilot: JSBSim Cessna 172 with MaleCNS visual encoding and a trained temporal decoder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsbsim>=1.2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "websockets>=12.0",
  "pyarrow>=15.0",
  "torch>=2.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fly-pilot = "fly_pilot.server:main"
fly-pilot-eval = "fly_pilot.evaluate:main"
fly-pilot-record = "fly_pilot.record_expert:main"
fly-pilot-record-observing = "fly_pilot.record_observing:main"
fly-pilot-record-decoder = "fly_pilot.record_decoder:main"
fly-pilot-record-dagger = "fly_pilot.record_dagger:main"
fly-pilot-train-decoder = "fly_pilot.train_decoder:main"
fly-pilot-eval-decoder = "fly_pilot.evaluate_decoder:main"
fly-pilot-eval-fly = "fly_pilot.evaluate_fly:main"
fly-pilot-verify-artifact = "fly_pilot.verify_artifact:main"
fly-pilot-diagnose-decoder = "fly_pilot.diagnose_decoder:main"
fly-pilot-select-decoder = "fly_pilot.select_decoder:main"
fly-pilot-train-graph = "fly_pilot.train_graph_policy:main"
fly-pilot-eval-graph = "fly_pilot.evaluate_graph:main"
fly-pilot-verify-graph = "fly_pilot.verify_graph_artifact:main"

[tool.setuptools.packages.find]
include = ["fly_pilot*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
